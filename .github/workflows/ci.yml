name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcrun swift --version
      - name: Test
        run: scripts/test.sh
      - name: Release build
        run: swift build -c release
      - name: Smoke test
        run: scripts/smoke-test.sh "$(swift build -c release --show-bin-path)/dread"

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release

  linux-static:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
      - name: Build static binaries
        run: |
          swift build -c release --swift-sdk x86_64-swift-linux-musl
          swift build -c release --swift-sdk aarch64-swift-linux-musl
      - name: Smoke test
        run: scripts/smoke-test.sh "$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/dread"
