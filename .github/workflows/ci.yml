name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcrun swift --version
      - name: Test
        run: scripts/test.sh
      - name: Release build
        run: swift build -c release
